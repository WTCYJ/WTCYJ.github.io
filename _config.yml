title: "MONKEY PATCH"
tagline: "코드를 만들고, 뜯어보고, 끝까지 기록합니다"
description: "개발, 웹, 시스템, 리버싱, 포렌식, 안드로이드, 논문과 기술 기록을 다루는 보안 블로그"
url: "https://wtcyj.github.io"
baseurl: ""

author:
  name: "WTCY"
  email: ""
  github: "WTCYJ"

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

collections:
  posts:
    output: true

defaults:
  - scope:
      path: "_posts"
    values:
      layout: "post"
      permalink: /posts/:title/

# 카테고리 정의는 _data/categories.yml 로 이동했습니다.

exclude:
  - sitemap.xml
  - feed.xml
  - LICENSE
  - README.md
  - Gemfile
  - Gemfile.lock
  - labs/android-concept-atlas-evidence-app/build
  - labs/android-concept-atlas-research-method/build

kramdown:
  math_engine: null
  syntax_highlighter: rouge

future: true
