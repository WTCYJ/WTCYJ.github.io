<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="컴포넌트 수 1부터 7까지 잰 거부 지점 그래프. 패치 전은 100 곱하기 컴포넌트 수 더하기 1 직선 위에 일곱 점이 모두 놓이고, 패치 후는 컴포넌트 수와 무관하게 101에서 평평하다">
  <style>
    .bg{fill:#070a12}
    .ttl{fill:#f0f5ff;font:600 19px system-ui,-apple-system,'Segoe UI',sans-serif}
    .sub{fill:#8fa2bf;font:400 13px system-ui,-apple-system,'Segoe UI',sans-serif}
    .axis{stroke:#2a3548;stroke-width:1}
    .grid{stroke:#161f2e;stroke-width:1}
    .lab{fill:#8fa2bf;font:400 12px system-ui,-apple-system,'Segoe UI',sans-serif}
    .pt{fill:#ff2bd6}
    .pt2{fill:#4ddb9a}
    .l1{stroke:#ff2bd6;stroke-width:2;fill:none}
    .l2{stroke:#4ddb9a;stroke-width:2;fill:none}
    .val{fill:#f2f6ff;font:600 11px ui-monospace,'Cascadia Mono',Consolas,monospace}
    .leg{fill:#cdd8e8;font:600 13px system-ui,-apple-system,'Segoe UI',sans-serif}
    .box{fill:#0d1420;stroke:#1b2537;stroke-width:1;rx:6}
  </style>
  <rect class="bg" width="900" height="470"/>
  <text class="ttl" x="28" y="36">컴포넌트 수를 1부터 7까지 바꿔 가며 잰 거부 지점</text>
  <text class="sub" x="28" y="59">패치 전은 일곱 점이 모두 직선 위에 놓입니다. 패치 후는 컴포넌트를 늘려도 움직이지 않습니다.</text>

  <line class="axis" x1="120" y1="380" x2="700" y2="380"/>
  <line class="axis" x1="120" y1="130" x2="120" y2="380"/>
  <line class="grid" x1="120" y1="347" x2="700" y2="347"/>
  <line class="grid" x1="120" y1="282" x2="700" y2="282"/>
  <line class="grid" x1="120" y1="217" x2="700" y2="217"/>
  <line class="grid" x1="120" y1="152" x2="700" y2="152"/>
  <text class="lab" x="112" y="384" text-anchor="end">0</text>
  <text class="lab" x="112" y="351" text-anchor="end">100</text>
  <text class="lab" x="112" y="286" text-anchor="end">300</text>
  <text class="lab" x="112" y="221" text-anchor="end">500</text>
  <text class="lab" x="112" y="156" text-anchor="end">700</text>
  <text class="lab" x="150" y="400" text-anchor="middle">1</text>
  <text class="lab" x="233" y="400" text-anchor="middle">2</text>
  <text class="lab" x="317" y="400" text-anchor="middle">3</text>
  <text class="lab" x="400" y="400" text-anchor="middle">4</text>
  <text class="lab" x="483" y="400" text-anchor="middle">5</text>
  <text class="lab" x="567" y="400" text-anchor="middle">6</text>
  <text class="lab" x="650" y="400" text-anchor="middle">7</text>
  <text class="lab" x="400" y="424" text-anchor="middle">configurationActivity 로 쓴 컴포넌트 수 C</text>
  <text class="lab" x="40"  y="118">거부된 순번</text>

  <polyline class="l1" points="150,347 233,315 317,282 400,250 483,217 567,185 650,152"/>
  <circle class="pt" cx="150" cy="347" r="4.5"/>
  <circle class="pt" cx="233" cy="315" r="4.5"/>
  <circle class="pt" cx="317" cy="282" r="4.5"/>
  <circle class="pt" cx="400" cy="250" r="4.5"/>
  <circle class="pt" cx="483" cy="217" r="4.5"/>
  <circle class="pt" cx="567" cy="185" r="4.5"/>
  <circle class="pt" cx="650" cy="152" r="4.5"/>
  <text class="val" x="158" y="341" fill="#ff2bd6">101</text>
  <text class="val" x="241" y="309" fill="#ff2bd6">201</text>
  <text class="val" x="325" y="276" fill="#ff2bd6">301</text>
  <text class="val" x="408" y="244" fill="#ff2bd6">401</text>
  <text class="val" x="491" y="211" fill="#ff2bd6">501</text>
  <text class="val" x="575" y="179" fill="#ff2bd6">601</text>
  <text class="val" x="658" y="146" fill="#ff2bd6">701</text>

  <polyline class="l2" points="150,347 233,347 317,347 400,347 483,347 567,347 650,347"/>
  <circle class="pt2" cx="233" cy="347" r="4.5"/>
  <circle class="pt2" cx="317" cy="347" r="4.5"/>
  <circle class="pt2" cx="400" cy="347" r="4.5"/>
  <circle class="pt2" cx="483" cy="347" r="4.5"/>
  <circle class="pt2" cx="567" cy="347" r="4.5"/>
  <circle class="pt2" cx="650" cy="347" r="4.5"/>
  <text class="val" x="658" y="366" fill="#4ddb9a">101</text>

  <rect class="box" x="716" y="150" width="156" height="96"/>
  <text class="leg" x="732" y="176" fill="#ff2bd6">&#9679; r03 &#8212; 패치 전</text>
  <text class="lab" x="732" y="196">100 &#215; C + 1</text>
  <text class="leg" x="732" y="222" fill="#4ddb9a">&#9679; r05 &#8212; 패치 후</text>
  <text class="lab" x="732" y="240">C 와 무관하게 101</text>

  <text class="sub" x="28" y="452">별칭을 늘리려면 APK 를 다시 빌드해야 합니다. C=6·C=7 은 각각 새 빌드로 직전 점을 재확인한 뒤 표에 올렸습니다.</text>
</svg>
