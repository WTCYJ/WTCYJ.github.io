<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-label="API 레벨별로 배포된 에뮬레이터 이미지의 보안 패치 수준이 덮는 기간을 가로 막대로 그린 것. 최근 API 일수록 막대가 짧아지고, 여러 CVE의 수정일이 막대 바깥에 놓인다">
<style>
.bg{fill:#070a12}.ttl{fill:#f0f5ff;font:600 19px system-ui,-apple-system,'Segoe UI',sans-serif}
.sub{fill:#8fa2bf;font:400 13px system-ui,-apple-system,'Segoe UI',sans-serif}
.lab{fill:#cdd8e8;font:600 11px ui-monospace,Consolas,monospace}
.ax{fill:#6b7a92;font:400 10px ui-monospace,Consolas,monospace}
.note{fill:#8fa2bf;font:400 12px system-ui,-apple-system,'Segoe UI',sans-serif}
.cv{fill:#ff2bd6;font:600 9px ui-monospace,Consolas,monospace}
.bar{fill:#1d6b8f}.bar1{fill:#ff4d6a}.grid{stroke:#141c2b;stroke-width:1}
.cvl{stroke:#ff2bd6;stroke-width:1;stroke-dasharray:3 3}
</style>
<rect class="bg" x="0" y="0" width="900" height="640"/>
<text class="ttl" x="30" y="38">배포된 이미지가 실제로 덮는 기간</text>
<text class="sub" x="30" y="60">x86_64 시스템 이미지 156장을 전수 조사해, API 레벨마다 보안 패치 수준의 최저~최고를 그렸다.</text>
<text class="sub" x="30" y="80">막대 밖에 있는 수정일은 그 API 로는 패치 전·후를 비교할 수 없다는 뜻이다.</text>
