<text class="note" x="30" y="522">빨간 막대는 덮는 기간이 6개월 미만인 트랙이다. 최근 API 일수록 짧다 — API 34 는 두 달, API 35 는 석 달, API 36 은 넉 달.</text>
<text class="note" x="30" y="542">분홍 점선은 이 시리즈에서 다룬 CVE 의 수정 반영 시점이다.</text>
