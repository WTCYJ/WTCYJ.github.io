<text class="cds" x="200" y="338" text-anchor="middle">5978464</text>
<text class="cds" fill="#4aa3cc" x="200" y="162" text-anchor="middle">바뀜</text>
<text class="cds" fill="#ffb63d" x="200" y="284" text-anchor="middle">바뀜</text>
