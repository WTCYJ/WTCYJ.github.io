<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="API 28 이미지 여덟 장에서 사용자영역 보안 패치 라벨과 커널이 서로 다른 지점에서 바뀌는 것을 보여주는 도식. 마지막 세 장은 라벨이 2018-09-05 에서 2019-08-05 로 뛰는데 커널은 그대로다">
<style>
.bg{fill:#070a12}.ttl{fill:#f0f5ff;font:600 19px system-ui,-apple-system,'Segoe UI',sans-serif}
.sub{fill:#8fa2bf;font:400 13px system-ui,-apple-system,'Segoe UI',sans-serif}
.ph{fill:#cdd8e8;font:600 13px system-ui,-apple-system,'Segoe UI',sans-serif}
.cd{fill:#dfe7f5;font:400 11px ui-monospace,Consolas,monospace}
.cds{fill:#8fa2bf;font:400 10px ui-monospace,Consolas,monospace}
.note{fill:#8fa2bf;font:400 12px system-ui,-apple-system,'Segoe UI',sans-serif}
.bad{fill:#ff4d6a;font:600 12px system-ui,-apple-system,'Segoe UI',sans-serif}
.dot{fill:#1d6b8f;stroke:#4aa3cc;stroke-width:1.5}
.dotk{fill:#5a3a12;stroke:#ffb63d;stroke-width:1.5}
.line{stroke:#2a3purple}
</style>
<rect class="bg" x="0" y="0" width="900" height="470"/>
<text class="ttl" x="30" y="36">두 축은 따로 움직인다 — API 28 이미지 여덟 장</text>
<text class="sub" x="30" y="58">위는 사용자영역 보안 패치 라벨, 아래는 실제 커널. 점이 바뀌는 자리가 서로 다르다.</text>
<line x1="90" y1="140" x2="860" y2="140" stroke="#1b2537" stroke-width="2"/>
