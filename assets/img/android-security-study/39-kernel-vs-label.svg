<rect x="614" y="48" width="272" height="310" fill="none" stroke="#ff4d6a" stroke-width="1.5" stroke-dasharray="5 4" rx="6"/>
<text class="bad" x="30" y="392">마지막 세 장(r09·r10·r11)은 커널이 바이트 단위로 같다. 그런데 라벨은 2018-09-05 에서 2019-08-05 로 열한 달을 뛴다.</text>
<text class="note" x="30" y="416">그 커널은 <tspan class="cd">Linux version 4.4.124+ … Wed Jan 30 07:13:09 UTC 2019</tspan> 로, 2019년 1월에 빌드된 것이다.</text>
<text class="note" x="30" y="440">즉 "2019-08-05 패치" 라고 적힌 이미지가 2019년 1월 커널을 싣고 있다. 커널 CVE 를 이 라벨로 판정하면 틀린다.</text>
</svg>