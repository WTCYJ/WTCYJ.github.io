<circle class="dotk" cx="90" cy="300" r="5"/>
<text class="cd" x="90" y="124" text-anchor="middle" transform="rotate(-40 90 124)">2018-06-05</text>
<text class="cds" x="90" y="322" text-anchor="middle">e276dd</text>
<text class="cds" x="90" y="338" text-anchor="middle">5826640</text>
