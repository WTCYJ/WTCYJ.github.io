<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" role="img" aria-label="컴포넌트 수를 바꿔가며 두 이미지에서 측정한 자동 Zen 규칙 한도 결과 행렬">
  <style>
    .bg{fill:#070a12}
    .ttl{fill:#f0f5ff;font:600 19px system-ui,-apple-system,'Segoe UI',sans-serif}
    .sub{fill:#8fa2bf;font:400 13px system-ui,-apple-system,'Segoe UI',sans-serif}
    .hd{fill:#cdd8e8;font:600 14px system-ui,-apple-system,'Segoe UI',sans-serif}
    .lbl{fill:#dfe7f5;font:400 13px system-ui,-apple-system,'Segoe UI',sans-serif}
    .val{fill:#f2f6ff;font:600 15px ui-monospace,'Cascadia Mono',Consolas,monospace}
    .hit{fill:#ff2bd6;font:600 15px ui-monospace,'Cascadia Mono',Consolas,monospace}
    .free{fill:#4ddb9a;font:600 15px ui-monospace,'Cascadia Mono',Consolas,monospace}
    .tag{fill:#8fa2bf;font:400 12px system-ui,-apple-system,'Segoe UI',sans-serif}
    .rule{stroke:#1b2537;stroke-width:1}
    .box{fill:#0d1420;stroke:#1b2537;stroke-width:1;rx:6}
  </style>
  <rect class="bg" width="900" height="450"/>
  <text class="ttl" x="28" y="38">자동 Zen 규칙 한도 &#8212; 컴포넌트 수를 바꿔 측정</text>
  <text class="sub" x="28" y="61">거부는 전부 IllegalArgumentException: Rule instance limit exceeded. 앱이 센 값과 dumpsys 값이 일치.</text>

  <line class="rule" x1="28" y1="84" x2="872" y2="84"/>
  <text class="hd"  x="40"  y="106">측정 조건</text>
  <text class="hd"  x="470" y="106" text-anchor="middle">r03</text>
  <text class="hd"  x="700" y="106" text-anchor="middle">r05</text>
  <text class="tag" x="470" y="124" text-anchor="middle">패치 2022-08-01</text>
  <text class="tag" x="700" y="124" text-anchor="middle">패치 2022-10-01</text>
  <line class="rule" x1="28" y1="138" x2="872" y2="138"/>

  <text class="lbl" x="40"  y="170">컴포넌트 1개 &#183; 400회 시도</text>
  <text class="val" x="470" y="170" text-anchor="middle">101에서 거부</text>
  <text class="val" x="700" y="170" text-anchor="middle">101에서 거부</text>
  <text class="tag" x="40"  y="190">&#8594; 차이가 없다. 이 측정으로는 갈리지 않는다.</text>

  <line class="rule" x1="28" y1="206" x2="872" y2="206"/>

  <rect x="28" y="214" width="844" height="46" fill="#16091f"/>
  <text class="lbl"  x="40"  y="243">컴포넌트 5개 &#183; 400회 시도</text>
  <text class="free" x="470" y="243" text-anchor="middle">거부 없음</text>
  <text class="hit"  x="700" y="243" text-anchor="middle">101에서 거부</text>

  <text class="lbl" x="40"  y="288">컴포넌트 5개 &#183; 600회 시도</text>
  <text class="hit" x="470" y="288" text-anchor="middle">501에서 거부</text>
  <text class="tag" x="700" y="288" text-anchor="middle">&#8212;</text>
  <text class="tag" x="40"  y="308">&#8594; 5 &#215; 100 = 500. 예측한 천장이 그대로 나왔다.</text>

  <line class="rule" x1="28" y1="326" x2="872" y2="326"/>

  <rect class="box" x="28" y="340" width="410" height="94"/>
  <text class="hd"  x="46" y="366">r03 &#8212; 컴포넌트당 100개</text>
  <text class="sub" x="46" y="390">이름이 다른 컴포넌트를 쓰면 카운터가 갈라집니다.</text>
  <text class="sub" x="46" y="412">별칭을 늘린 수만큼 한도가 곱해집니다.</text>

  <rect class="box" x="462" y="340" width="410" height="94"/>
  <text class="hd"  x="480" y="366">r05 &#8212; 패키지당 100개</text>
  <text class="sub" x="480" y="390">컴포넌트를 몇 개로 늘려도 같은 한도에 합산됩니다.</text>
  <text class="sub" x="480" y="412">패치가 바꾼 것은 한도가 아니라 세는 단위입니다.</text>
</svg>
