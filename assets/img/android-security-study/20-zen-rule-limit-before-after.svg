<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="자동 Zen 규칙 등록 한도 검사의 패치 전후 비교도">
  <style>
    .bg{fill:#070a12}
    .ttl{fill:#f0f5ff;font:600 19px system-ui,-apple-system,'Segoe UI',sans-serif}
    .sub{fill:#8fa2bf;font:400 13px system-ui,-apple-system,'Segoe UI',sans-serif}
    .ph{fill:#cdd8e8;font:600 15px system-ui,-apple-system,'Segoe UI',sans-serif}
    .cd{fill:#dfe7f5;font:400 13px ui-monospace,'Cascadia Mono',Consolas,monospace}
    .cdsm{fill:#dfe7f5;font:400 12px ui-monospace,'Cascadia Mono',Consolas,monospace}
    .cdim{fill:#6f7f99;font:400 13px ui-monospace,'Cascadia Mono',Consolas,monospace}
    .bad{fill:#ff4d6a;font:600 14px system-ui,-apple-system,'Segoe UI',sans-serif}
    .good{fill:#ffb63d;font:600 14px system-ui,-apple-system,'Segoe UI',sans-serif}
    .note{fill:#8fa2bf;font:400 12px system-ui,-apple-system,'Segoe UI',sans-serif}
    .box{fill:#0d1420;stroke:#1b2537;stroke-width:1;rx:6}
  </style>
  <rect class="bg" width="900" height="470"/>
  <text class="ttl" x="28" y="38">ZenModeHelper.addAutomaticZenRule &#8212; 한도 검사의 전&#183;후</text>
  <text class="sub" x="28" y="61">일반 앱이 자기 패키지의 자동 &#8220;방해 금지&#8221; 규칙을 등록하는 경로입니다. 필요한 것은 정책 접근 권한 하나뿐입니다.</text>

  <rect class="box" x="28" y="84" width="410" height="250"/>
  <text class="ph" x="46" y="112">패치 전 &#8212; r03 / android-12.0.0_r34</text>
  <text class="cd" x="46" y="146">int ruleInstanceLimit = meta.getInt(</text>
  <text class="cd" x="46" y="166">    META_DATA_RULE_INSTANCE_LIMIT, <tspan fill="#ff4d6a">-1</tspan>);</text>
  <text class="cd" x="46" y="200">if (ruleInstanceLimit &gt; 0</text>
  <text class="cd" x="46" y="220">    &amp;&amp; ruleInstanceLimit &lt; newRuleInstanceCount) {</text>
  <text class="cdim" x="46" y="240">    throw new IllegalArgumentException(...);</text>
  <text class="cd" x="46" y="260">}</text>
  <text class="bad" x="46" y="294">한도는 앱이 스스로 선언한 값뿐</text>
  <text class="note" x="46" y="315">기본값이 -1 이라 조건이 항상 거짓 &#8594; 사실상 무제한</text>

  <text class="ph" x="450" y="212" fill="#ff2bd6">&#8594;</text>

  <rect class="box" x="472" y="84" width="400" height="250"/>
  <text class="ph" x="490" y="112">패치 후 &#8212; r05 / 커밋 0c607e70</text>
  <text class="cd" x="490" y="146" fill="#ffb63d">int newPackageRuleCount =</text>
  <text class="cd" x="490" y="166" fill="#ffb63d">    getPackageRuleCount(pkg) + 1;</text>
  <text class="cdsm" x="490" y="200">if (newPackageRuleCount &gt; RULE_LIMIT_PER_PACKAGE</text>
  <text class="cdsm" x="490" y="220">        || (ruleInstanceLimit &gt; 0 &amp;&amp; ...)) {</text>
  <text class="cd" x="490" y="240">    throw new IllegalArgumentException(...);</text>
  <text class="cd" x="490" y="260">}</text>
  <text class="good" x="490" y="294">패키지 단위로 세는 검사를 OR 로 추가</text>
  <text class="note" x="490" y="315">앱 선언 한도는 그대로 두고 상한을 하나 더 얹음</text>

  <rect class="box" x="28" y="352" width="844" height="94"/>
  <text class="ph" x="46" y="380">세는 단위가 핵심입니다</text>
  <text class="sub" x="46" y="404">기존 <tspan class="cd">newRuleInstanceCount</tspan> 는 owner 와 configurationActivity <tspan fill="#ff4d6a">컴포넌트 이름</tspan> 을 기준으로 셌습니다.</text>
  <text class="sub" x="46" y="428">컴포넌트를 바꿔 가며 부르면 같은 앱이라도 카운터가 갈라집니다. 패치는 기준을 <tspan fill="#ffb63d">패키지</tspan> 로 바꿉니다.</text>
</svg>
