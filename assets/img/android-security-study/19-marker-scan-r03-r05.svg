<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="r03과 r05 시스템 이미지의 패치 마커 문자열 실측 결과 표">
  <style>
    .bg{fill:#070a12}
    .ttl{fill:#f0f5ff;font:600 19px system-ui,-apple-system,'Segoe UI',sans-serif}
    .sub{fill:#8fa2bf;font:400 13px system-ui,-apple-system,'Segoe UI',sans-serif}
    .hd{fill:#cdd8e8;font:600 14px system-ui,-apple-system,'Segoe UI',sans-serif}
    .mk{fill:#dfe7f5;font:400 13px ui-monospace,'Cascadia Mono',Consolas,monospace}
    .nm{fill:#f2f6ff;font:600 15px ui-monospace,'Cascadia Mono',Consolas,monospace}
    .no{fill:#5d6b83;font:600 15px ui-monospace,'Cascadia Mono',Consolas,monospace}
    .tag{fill:#8fa2bf;font:400 12px system-ui,-apple-system,'Segoe UI',sans-serif}
    .hit{fill:#ff2bd6;font:600 12px system-ui,-apple-system,'Segoe UI',sans-serif}
    .rule{stroke:#1b2537;stroke-width:1}
  </style>
  <rect class="bg" width="900" height="430"/>
  <text class="ttl" x="28" y="40">system.img 패치 마커 실측 &#8212; android-31 r03 vs r05</text>
  <text class="sub" x="28" y="63">압축을 풀지 않고 zip 안의 system.img(각 4,306,501,632 B)를 스트리밍하며 문자열 출현 횟수를 셈</text>

  <line class="rule" x1="28" y1="86" x2="872" y2="86"/>
  <text class="hd" x="40"  y="108">마커 문자열</text>
  <text class="hd" x="330" y="108" text-anchor="middle">r03</text>
  <text class="hd" x="420" y="108" text-anchor="middle">r05</text>
  <text class="hd" x="484" y="108">판정</text>
  <text class="tag" x="330" y="126" text-anchor="middle">2022-08-01</text>
  <text class="tag" x="420" y="126" text-anchor="middle">2022-10-01</text>
  <line class="rule" x1="28" y1="140" x2="872" y2="140"/>

  <rect x="28" y="148" width="844" height="38" fill="#16091f"/>
  <text class="mk"  x="40"  y="172">getPackageRuleCount</text>
  <text class="no"  x="330" y="173" text-anchor="middle">0</text>
  <text class="nm"  x="420" y="173" text-anchor="middle" fill="#ff2bd6">1</text>
  <text class="hit" x="484" y="172">CVE-2022-20425 패치 &#8212; r05에만 있음</text>

  <text class="mk"  x="40"  y="216">Rule instance limit exceeded</text>
  <text class="nm"  x="330" y="217" text-anchor="middle">1</text>
  <text class="nm"  x="420" y="217" text-anchor="middle">1</text>
  <text class="tag" x="484" y="216">대조군 &#8212; 취약 코드에도 있는 throw</text>

  <text class="mk"  x="40"  y="252">addAutomaticZenRule</text>
  <text class="nm"  x="330" y="253" text-anchor="middle">5</text>
  <text class="nm"  x="420" y="253" text-anchor="middle">5</text>
  <text class="tag" x="484" y="252">대조군 &#8212; 취약 함수 자체</text>

  <line class="rule" x1="28" y1="272" x2="872" y2="272"/>

  <text class="mk"  x="40"  y="304">204906124</text>
  <text class="nm"  x="330" y="305" text-anchor="middle">1</text>
  <text class="nm"  x="420" y="305" text-anchor="middle">1</text>
  <text class="tag" x="484" y="304">CVE-2022-20394 &#8212; r03이 이미 패치 보유, 탈락</text>

  <text class="mk"  x="40"  y="340">seems malicious</text>
  <text class="nm"  x="330" y="341" text-anchor="middle">1</text>
  <text class="no"  x="420" y="341" text-anchor="middle">0</text>
  <text class="tag" x="484" y="340">CVE-2022-20392 &#8212; 로그만 지운 커밋, 탈락</text>

  <line class="rule" x1="28" y1="362" x2="872" y2="362"/>
  <text class="sub" x="28" y="390">0&#8594;1 로 갈리는 마커만이 &#8220;이 이미지 쌍으로 전&#183;후를 비교할 수 있다&#8221;의 증거입니다.</text>
  <text class="sub" x="28" y="412">양쪽이 같은 값이면 그 CVE는 이 쌍으로 구분되지 않으므로 후보에서 뺍니다.</text>
</svg>
